name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, fileinfo, json, openssl, gd
          tools: composer:v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install audited backend dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build

      - name: Verify backend
        working-directory: backend
        run: |
          composer validate --strict --no-interaction
          composer audit --locked --no-interaction
          find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Assemble public_html update
        shell: bash
        run: |
          mkdir -p release/public_html/api release/public_html/config release/public_html/vendor
          cp -a frontend/dist/. release/public_html/
          cp backend/api/index.php release/public_html/api/index.php
          cp backend/api/books.php release/public_html/api/books.php
          cp -a backend/config/. release/public_html/config/
          cp -a backend/vendor/. release/public_html/vendor/
          cp backend/.htaccess release/public_html/.htaccess
          cp backend/.user.ini release/public_html/.user.ini

      - name: Deploy through FTPS
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./release/public_html/
          server-dir: ${{ secrets.HOSTINGER_FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/uploads/**
