name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, fileinfo, json, openssl, gd
          tools: composer:v2

      - name: Validate and install backend dependencies
        working-directory: backend
        run: |
          composer validate --strict --no-interaction
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Audit backend dependencies
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: find backend -path backend/vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Verify production security headers are configured
        run: |
          grep -q "Strict-Transport-Security" backend/.htaccess
          grep -q "Content-Security-Policy" backend/.htaccess
